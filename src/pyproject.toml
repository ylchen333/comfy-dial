[project]
name = "comfy-osh"
version = "0.0.0"
description = "Closed-loop camera director: verifier and contract mirrors"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "packages/contracts/python"]
addopts = "-q"
